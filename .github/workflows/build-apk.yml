name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.0.1)'
        required: false
        default: 'dev-build'

# ── Explicit permissions required for gh release create ───────────────────────
permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK ────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Bootstrap gradle-wrapper.jar if missing ────────────────────────
      - name: Bootstrap Gradle Wrapper JAR
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found — generating..."
            sudo apt-get install -y gradle 2>/dev/null
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            echo "gradle-wrapper.jar generated"
          else
            echo "gradle-wrapper.jar already present"
          fi

      # ── 5. Gradle wrapper permissions ─────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 6. Decode keystore ────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.jks

      # ── 7. Inject Google Web Client ID ────────────────────────────────────
      - name: Inject Google Web Client ID
        run: |
          sed -i 's|YOUR_WEB_CLIENT_ID_HERE.apps.googleusercontent.com|${{ secrets.GOOGLE_WEB_CLIENT_ID }}|g' \
            app/build.gradle.kts

      # ── 8. Build release APK ──────────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 9. Rename APK & resolve version ───────────────────────────────────
      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Source APK: $SRC"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version_name }}" ]]; then
            VERSION="${{ github.event.inputs.version_name }}"
          else
            VERSION="dev-build"
          fi

          DEST="AviatorPredictor-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "Renamed to: $DEST"

          echo "apk_path=$DEST"    >> $GITHUB_OUTPUT
          echo "version=$VERSION"  >> $GITHUB_OUTPUT

      # ── 10. Upload APK as workflow artifact ───────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviator-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      # ── 11. Delete existing release/tag with same name (manual runs) ──────
      #        Prevents "release already exists" errors when re-running
      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.apk.outputs.version }}"
          # Delete release (ignore error if not found)
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          # Delete the tag too so gh release create can recreate it
          git push origin ":refs/tags/$VERSION" 2>/dev/null || true

      # ── 12. Create GitHub Release (tag pushes AND manual dispatch) ────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.apk.outputs.version }}"
          APK="${{ steps.apk.outputs.apk_path }}"

          echo "Creating release for: $VERSION"
          echo "Attaching APK: $APK"

          NOTES=$(cat <<'RELEASE_NOTES'
          ## What's New
          - Native Android app with Jetpack Compose
          - Google Sign-In authentication
          - All data synced to Google Drive (private appDataFolder)
          - Full signal calculation matching web app algorithm
          - Live countdown timers with 90-second bet window
          - Win/Loss quick-mark via notification action buttons
          - Auto-mark missed signals after grace period

          ## Installation
          1. Download the APK from the assets below
          2. On your Android device: Settings > Security > Allow unknown sources
          3. Open the APK file and install
          4. Sign in with your Google account

          ## Requirements
          - Android 8.0 (API 26) or higher
          - Google account for sign-in and Drive sync
          RELEASE_NOTES
          )

          # --create-tag lets gh create a lightweight tag even without a push event
          gh release create "$VERSION" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aviator Predictor $VERSION" \
            --notes "$NOTES" \
            --create-tag

          echo "Release created successfully"
