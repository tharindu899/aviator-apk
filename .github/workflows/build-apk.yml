name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 2.0.1)'
        required: false
        default: 'dev-build'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK ────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Bootstrap gradle-wrapper.jar if missing ────────────────────────
      - name: Bootstrap Gradle Wrapper JAR
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found — generating via system gradle..."
            sudo apt-get install -y gradle 2>/dev/null
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            echo "✅ gradle-wrapper.jar generated"
          else
            echo "✅ gradle-wrapper.jar already present"
          fi

      # ── 5. Gradle wrapper permissions ─────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 6. Decode keystore ────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      # ── 7. Inject Web Client ID ───────────────────────────────────────────
      - name: Inject Google Web Client ID
        run: |
          sed -i 's|YOUR_WEB_CLIENT_ID_HERE.apps.googleusercontent.com|${{ secrets.GOOGLE_WEB_CLIENT_ID }}|g' \
            app/build.gradle.kts

      # ── 8. Build release APK ──────────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 9. Locate & rename APK ────────────────────────────────────────────
      - name: Locate and rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK at: $APK_PATH"

          # Determine version label
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version_name }}"
          fi

          APK_NAME="AviatorPredictor-${VERSION}.apk"
          cp "$APK_PATH" "$APK_NAME"

          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "APK renamed to: $APK_NAME"

      # ── 10. Upload APK as workflow artifact ───────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aviator-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      # ── 11. Create GitHub Release (tag pushes only) ───────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Aviator Predictor ${{ github.ref_name }}"
          body: |
            ## Aviator Predictor ${{ github.ref_name }}

            ### What's New
            - Native Android app with Jetpack Compose
            - Google Sign-In authentication
            - All data synced to Google Drive (private appDataFolder)
            - Full signal calculation matching web app algorithm
            - Live countdown timers with 90-second bet window
            - Win/Loss quick-mark bar in bottom navigation
            - Auto-mark missed signals after grace period

            ### Installation
            1. Download `AviatorPredictor-${{ github.ref_name }}.apk`
            2. On your Android device: Settings → Security → Allow unknown sources
            3. Open the APK file and install
            4. Sign in with your Google account

            ### Requirements
            - Android 8.0 (API 26) or higher
            - Google account for sign-in and Drive sync
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
