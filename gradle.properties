# Project-wide Gradle settings

# AndroidX - required by Compose, Coil, and all modern Android libs
android.useAndroidX=true

# Jetifier rewrites legacy support-library deps to AndroidX at build time.
# Keep false unless you add a legacy (pre-AndroidX) library that needs it.
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Enables Gradle Build Cache
org.gradle.caching=true

# Parallel execution
org.gradle.parallel=true

# Use G1 GC and give the daemon enough heap for a Compose project
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 \
  -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8

# Non-transitive R classes (recommended for new projects)
android.nonTransitiveRClass=true
